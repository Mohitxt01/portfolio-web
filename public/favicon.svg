<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="volt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8ff00" />
      <stop offset="100%" stop-color="#6e56f8" />
    </linearGradient>
  </defs>

  <!-- Obsidian tile with a hairline edge, matching the site's surfaces -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="#060608" />
  <rect x="4.5" y="4.5" width="111" height="111" rx="25.5" fill="none"
        stroke="#f5f3ee" stroke-opacity="0.14" />

  <!-- M monogram, drawn as a stroke so it stays legible at 16px -->
  <path d="M34 82V38L60 64L86 38V82"
        fill="none" stroke="url(#volt)" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
